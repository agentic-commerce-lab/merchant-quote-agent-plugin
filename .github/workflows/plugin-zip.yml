name: Plugin Zip

# Builds an installable plugin zip on every merge to main, so a test shop can
# be brought up to date without a local toolchain. Also runs on demand, and on
# every published GitHub release, where the zip is attached to the release as
# MerchantQuoteAgentPlugin.zip -- the file the README's install step links to.
#
# Why shopware-cli rather than `zip -r`: this repository commits neither
# `vendor/` nor a compiled administration bundle, so a plain archive installs a
# plugin whose admin page never appears. `extension package` compiles the
# administration assets into src/Resources/public/ without needing a booted
# shop, and applies the excludes in .shopware-extension.yml.
#
# The zip carries no `vendor/`, by design rather than omission: shopware-cli
# skips dependency bundling for Shopware >= 6.5, because the shop resolves a
# plugin's Composer requirements itself through the `custom/plugins/*` path
# repository in its root composer.json. See the install note at the end of the
# job.

on:
  push:
    branches:
      - main
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: plugin-zip-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package plugin
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Full history so `git describe` below can find the latest release tag.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer

      # The administration build is a Vite/Node toolchain. Pinned rather than
      # inherited from the runner image so a runner upgrade cannot silently
      # change the compiled bundle.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup Shopware CLI
        uses: shopware/shopware-cli-action@v3

      # --disable-git packages the checked-out tree as it is. Without it
      # shopware-cli copies via git, which fails on the detached HEAD a push
      # checkout produces ("cannot find checkout tag or branch"). A fresh
      # checkout is already exactly the committed state.
      #
      # The version keeps composer.json clean: it is stamped into the artifact
      # instead, so every zip is traceable to the run that built it without
      # anyone having to remember to bump a number.
      #
      # A release build is stamped with the release tag's version (`v0.1.0` ->
      # `0.1.0`). The tag must be plain MAJOR.MINOR.PATCH: a shop's root
      # composer.json is `minimum-stability: stable`, so a bare `composer
      # require` cannot resolve `0.1.0-alpha1`, and Shopware's VersionSanitizer
      # turns `0.1.0-alpha.1` into `0.1.0-alpha`, so the admin upload's own
      # `composer require <name>:<version>` matches nothing. Say "alpha" in the
      # release title instead.
      #
      # Every other build is stamped `<major>.<minor of the latest release
      # tag>.<run>+<sha>` (`0.0.<run>` before the first release), so a build of
      # main always sorts above the release it follows and below the next one.
      #
      # Not a `dev-` version, nor the `0.0.0-main.<run>` this used to stamp.
      # Composer's VersionParser rejects `0.0.0-main.13`
      # outright ("Invalid version string"), because `main` is not one of its
      # stability modifiers -- so every `composer require`/`update` in a shop
      # holding this plugin through the custom/plugins/* path repo died there,
      # including the install step this job prints below.
      #
      # `dev-main-<sha>` parses but is worse: the shop has to opt into dev
      # stability to resolve it at all, and Shopware compares plugin versions
      # with version_compare() on the literal string, so build order would
      # follow the sha alphabetically (`dev-main-a22...` > `dev-main-f87...`).
      #
      # `+<sha>` is semver build metadata. Composer keeps it in the lock and in
      # the plugin's composer.json, so a shop records the exact commit it runs;
      # Shopware records it as `<major>.<minor>.<run>`, so its update
      # detection orders builds by run number. Full sha rather than a short one:
      # normalisation discards it either way, and it is what identifies the
      # build.
      - name: Choose version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "${{ github.event_name }}" = release ]; then
            VERSION="${TAG#v}"
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Release tag '$TAG' is not MAJOR.MINOR.PATCH; see the comment above this step."
              exit 1
            fi
          else
            LATEST="$(git describe --tags --abbrev=0 --match '[v0-9]*' 2>/dev/null || echo v0.0.0)"
            VERSION="$(echo "${LATEST#v}" | cut -d. -f1,2).${{ github.run_number }}+${{ github.sha }}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Package extension
        run: |
          shopware-cli extension package \
            --disable-git \
            --overwrite-version "$VERSION" \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: MerchantQuoteAgentPlugin-${{ github.run_number }}-${{ github.sha }}
          path: MerchantQuoteAgentPlugin.zip
          if-no-files-found: error
          retention-days: 30

      - name: How to install this
        run: |
          {
            echo "### Plugin zip"
            echo
            echo "Artifact: \`MerchantQuoteAgentPlugin-${{ github.run_number }}-${{ github.sha }}\`"
            echo "Version stamped into composer.json: \`${VERSION}\`"
            echo
            echo "A \`+<sha>\` suffix is semver build metadata: Composer keeps it in the shop's lock file, Shopware records the version without it."
            echo
            echo "The administration bundle is compiled into the zip, so the Quote Agent page appears without building assets in the shop."
            echo
            echo "**Installing into a test shop**"
            echo
            echo '```bash'
            echo "unzip MerchantQuoteAgentPlugin.zip -d /path/to/shop/custom/plugins/"
            echo "cd /path/to/shop"
            echo "composer require shopware/merchant-quote-agent-plugin"
            echo "bin/console plugin:refresh"
            echo "bin/console plugin:install --activate MerchantQuoteAgentPlugin"
            echo "bin/console cache:clear"
            echo '```'
            echo
            echo "The \`composer require\` step is what pulls the plugin's own dependencies — \`cuyz/valinor\` and \`ucp-php-sdk/core\` — which are deliberately not bundled. Shopware resolves them through the \`custom/plugins/*\` path repository in the shop's root composer.json."
            echo
            echo "**Prerequisites:** Composer >= 2.10.0 in the shop (older versions reject the \`config.audit.ignore\` object form that Shopware 6.7 templates write). Plus SwagCommercial with the QuoteManagement licence active. Agentic Commerce is optional, 1.3 or newer. All are requirements of the plugin and the shop, not of the zip."
          } >> "$GITHUB_STEP_SUMMARY"

  # A separate job so the write token never sits beside the npm and
  # shopware-cli build above: it only downloads the finished zip and attaches it.
  release-asset:
    name: Attach zip to release
    if: github.event_name == 'release'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: MerchantQuoteAgentPlugin-${{ github.run_number }}-${{ github.sha }}

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" MerchantQuoteAgentPlugin.zip --clobber --repo "${{ github.repository }}"
